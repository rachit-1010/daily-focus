<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="pages_browser.css">
  <title>Browse</title>
</head>
<body>

  <!-- ── List View ── -->
  <div class="list-view" id="list-view">
    <div class="browser-toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search..." autocomplete="off">
      </div>

      <div class="filter-tabs-row">
        <div class="filter-tabs" id="filter-tabs">
          <button class="filter-tab active" data-tab="work">Work <span class="tab-badge hidden" id="badge-work">0</span></button>
          <button class="filter-tab" data-tab="days">Days <span class="tab-badge hidden" id="badge-days">0</span></button>
          <button class="filter-tab" data-tab="notes">Notes <span class="tab-badge hidden" id="badge-notes">0</span></button>
        </div>
        <button class="new-note-btn" id="new-note-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          New Note
        </button>
      </div>
    </div>

    <!-- Tab content containers -->
    <div class="tab-content" id="tab-work">
      <div class="work-tree" id="work-tree"></div>
      <div class="empty-state" id="work-empty" style="display:none">
        <p>No tasks yet.</p>
      </div>
    </div>

    <div class="tab-content" id="tab-days" style="display:none">
      <div class="calendar-view" id="calendar-view"></div>
    </div>

    <div class="tab-content" id="tab-notes" style="display:none">
      <div class="notes-list" id="notes-list"></div>
      <div class="empty-state" id="notes-empty" style="display:none">
        <p>No notes yet. Create one to get started.</p>
      </div>
    </div>
  </div>

  <!-- ── Editor View ── -->
  <div class="editor-view hidden" id="editor-view">
    <div class="editor-toolbar">
      <button class="back-btn" id="back-btn" title="Back to list">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="editor-title-wrap">
        <span class="editor-title-display" id="editor-title-display"></span>
        <input type="text" class="editor-title-input" id="editor-title-input" style="display:none" placeholder="Untitled">
      </div>
      <span class="editor-type-badge" id="editor-type-badge"></span>
    </div>
    <div class="editor-toggle-row">
      <div class="page-view-toggle" id="browser-view-toggle">
        <button class="view-btn active" data-view="notes">Notes</button>
        <button class="view-btn" data-view="timeline">Timeline</button>
      </div>
      <button class="fmt-toggle-btn" id="fmt-toggle-btn" title="Formatting">Aa</button>
    </div>
    <div class="editor-format-bar" id="editor-format-bar" style="display:none">
      <button class="fmt-btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="fmt-btn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button class="fmt-btn" data-cmd="strike" title="Strikethrough"><s>S</s></button>
      <button class="fmt-btn" data-cmd="code" title="Inline code"><code>&lt;&gt;</code></button>
      <span class="fmt-sep"></span>
      <button class="fmt-btn" data-cmd="h1" title="Heading 1">H1</button>
      <button class="fmt-btn" data-cmd="h2" title="Heading 2">H2</button>
      <button class="fmt-btn" data-cmd="h3" title="Heading 3">H3</button>
      <span class="fmt-sep"></span>
      <button class="fmt-btn" data-cmd="bulletList" title="Bullet list">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="2.5" cy="3.5" r="1" fill="currentColor"/><circle cx="2.5" cy="7" r="1" fill="currentColor"/><circle cx="2.5" cy="10.5" r="1" fill="currentColor"/><path d="M5.5 3.5h6M5.5 7h6M5.5 10.5h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="orderedList" title="Ordered list">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><text x="1" y="5" font-size="5.5" fill="currentColor" font-family="inherit">1.</text><text x="1" y="8.5" font-size="5.5" fill="currentColor" font-family="inherit">2.</text><text x="1" y="12" font-size="5.5" fill="currentColor" font-family="inherit">3.</text><path d="M5.5 3.5h6M5.5 7h6M5.5 10.5h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="blockquote" title="Blockquote">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3v8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M6.5 5h5M6.5 7.5h4M6.5 10h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="codeBlock" title="Code block">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4.5 4L2 7l2.5 3M9.5 4L12 7l-2.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="horizontalRule" title="Horizontal rule">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="editor-wrap">
      <div class="editor-container" id="editor-container"></div>
      <div class="timeline-container" id="browser-timeline-container" style="display:none"></div>
    </div>
    <div class="editor-status" id="editor-status"></div>
  </div>

  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core@2';
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2';
    import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder@2';

  (async function () {
    'use strict';

    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    // ── State ──

    let allPages = [];
    let activeTab = 'work';
    let searchQuery = '';
    let searchTimer = null;
    let currentPageId = null;
    let currentPageMeta = null;
    let saveTimer = null;

    // Work tree state
    let allTasksData = { projects: [], tasks: [] };
    let expandedProjects = new Set();
    let expandedArchived = new Set(); // tracks which project/section has archived expanded

    // Calendar state
    const now = new Date();
    let calendarYear = now.getFullYear();
    let calendarMonth = now.getMonth() + 1; // 1-indexed
    let monthTimeData = {};

    // Search state for calendar highlighting
    let searchMatchedDailyIds = new Set();

    // ── DOM refs ──

    const listView = document.getElementById('list-view');
    const editorView = document.getElementById('editor-view');
    const searchInput = document.getElementById('search-input');
    const filterTabs = document.getElementById('filter-tabs');
    const newNoteBtn = document.getElementById('new-note-btn');
    const backBtn = document.getElementById('back-btn');
    const editorTitleDisplay = document.getElementById('editor-title-display');
    const editorTitleInput = document.getElementById('editor-title-input');
    const editorTypeBadge = document.getElementById('editor-type-badge');
    const editorContainer = document.getElementById('editor-container');
    const editorFormatBar = document.getElementById('editor-format-bar');
    const fmtToggleBtn = document.getElementById('fmt-toggle-btn');
    const editorStatus = document.getElementById('editor-status');

    const tabWork = document.getElementById('tab-work');
    const tabDays = document.getElementById('tab-days');
    const tabNotes = document.getElementById('tab-notes');
    const workTree = document.getElementById('work-tree');
    const workEmpty = document.getElementById('work-empty');
    const calendarView = document.getElementById('calendar-view');
    const notesList = document.getElementById('notes-list');
    const notesEmpty = document.getElementById('notes-empty');
    const badgeWork = document.getElementById('badge-work');
    const badgeDays = document.getElementById('badge-days');
    const badgeNotes = document.getElementById('badge-notes');

    function reveal() { document.body.classList.add('ready'); }

    let fmtBarOpen = false;
    fmtToggleBtn.addEventListener('click', () => {
      fmtBarOpen = !fmtBarOpen;
      editorFormatBar.style.display = fmtBarOpen ? '' : 'none';
      fmtToggleBtn.classList.toggle('active', fmtBarOpen);
    });

    // ── Tiptap editor ──

    let editor = null;

    function contentToHtml(raw) {
      if (!raw || raw.trim() === '') return '';
      if (raw.match(/^<[a-z][\s\S]*>/i)) return raw;
      return raw.split('\n').map(line =>
        line.trim() === '' ? '<p></p>' : `<p>${line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`
      ).join('');
    }

    function initEditor() {
      editor = new Editor({
        element: editorContainer,
        extensions: [
          StarterKit,
          Placeholder.configure({ placeholder: 'Write your notes here...' }),
        ],
        content: '',
        onUpdate: () => scheduleSave(),
        onSelectionUpdate: () => updateToolbarState(),
        editorProps: {
          clipboardTextSerializer: (slice) => {
            const lines = [];
            slice.content.forEach(node => {
              if (node.type.name === 'paragraph') {
                lines.push(node.textContent);
              } else if (node.type.name === 'heading') {
                lines.push(node.textContent);
              } else if (node.type.name === 'bulletList' || node.type.name === 'orderedList') {
                let idx = 1;
                node.content.forEach(li => {
                  const prefix = node.type.name === 'orderedList' ? `${idx++}. ` : '- ';
                  lines.push(prefix + li.textContent);
                });
              } else if (node.type.name === 'codeBlock') {
                lines.push(node.textContent);
              } else if (node.type.name === 'blockquote') {
                node.content.forEach(child => {
                  lines.push('> ' + child.textContent);
                });
              } else {
                lines.push(node.textContent);
              }
            });
            return lines.join('\n');
          },
        },
      });
    }

    function updateToolbarState() {
      if (!editor) return;
      editorFormatBar.querySelectorAll('.fmt-btn').forEach(btn => {
        const cmd = btn.dataset.cmd;
        let active = false;
        if (cmd === 'bold') active = editor.isActive('bold');
        else if (cmd === 'italic') active = editor.isActive('italic');
        else if (cmd === 'strike') active = editor.isActive('strike');
        else if (cmd === 'code') active = editor.isActive('code');
        else if (cmd === 'h1') active = editor.isActive('heading', { level: 1 });
        else if (cmd === 'h2') active = editor.isActive('heading', { level: 2 });
        else if (cmd === 'h3') active = editor.isActive('heading', { level: 3 });
        else if (cmd === 'bulletList') active = editor.isActive('bulletList');
        else if (cmd === 'orderedList') active = editor.isActive('orderedList');
        else if (cmd === 'blockquote') active = editor.isActive('blockquote');
        else if (cmd === 'codeBlock') active = editor.isActive('codeBlock');
        btn.classList.toggle('active', active);
      });
    }

    editorFormatBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.fmt-btn');
      if (!btn || !editor) return;
      const cmd = btn.dataset.cmd;
      const chain = editor.chain().focus();
      if (cmd === 'bold') chain.toggleBold().run();
      else if (cmd === 'italic') chain.toggleItalic().run();
      else if (cmd === 'strike') chain.toggleStrike().run();
      else if (cmd === 'code') chain.toggleCode().run();
      else if (cmd === 'h1') chain.toggleHeading({ level: 1 }).run();
      else if (cmd === 'h2') chain.toggleHeading({ level: 2 }).run();
      else if (cmd === 'h3') chain.toggleHeading({ level: 3 }).run();
      else if (cmd === 'bulletList') chain.toggleBulletList().run();
      else if (cmd === 'orderedList') chain.toggleOrderedList().run();
      else if (cmd === 'blockquote') chain.toggleBlockquote().run();
      else if (cmd === 'codeBlock') chain.toggleCodeBlock().run();
      else if (cmd === 'horizontalRule') chain.setHorizontalRule().run();
    });

    initEditor();

    // ── Helpers ──

    function formatDuration(totalSeconds) {
      if (!totalSeconds || totalSeconds <= 0) return '—';
      const totalMin = Math.round(totalSeconds / 60);
      if (totalMin < 1) return '< 1m';
      if (totalMin < 60) return `${totalMin}m`;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return m > 0 ? `${h}h ${m}m` : `${h}h`;
    }

    function formatRelativeDate(ms) {
      const now = Date.now();
      const diff = now - ms;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      const d = new Date(ms);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function getBadgeLabel(type) {
      if (type === 'task') return 'Task';
      if (type === 'daily') return 'Day';
      if (type === 'project') return 'Project';
      return 'Note';
    }

    // ── Data loading ──

    async function loadPages() {
      try {
        allPages = await invoke('list_all_pages');
      } catch (e) {
        console.error('Failed to load pages:', e);
        allPages = [];
      }
    }

    async function loadWorkData() {
      try {
        allTasksData = await invoke('get_all_tasks_with_projects');
      } catch (e) {
        console.error('Failed to load tasks:', e);
        allTasksData = { projects: [], tasks: [] };
      }
    }

    async function loadCalendarData() {
      try {
        monthTimeData = await invoke('get_month_time_data', { year: calendarYear, month: calendarMonth });
      } catch (e) {
        console.error('Failed to load calendar data:', e);
        monthTimeData = {};
      }
    }

    // ── Tab switching ──

    function switchTab(tab) {
      activeTab = tab;
      filterTabs.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      tabWork.style.display = tab === 'work' ? '' : 'none';
      tabDays.style.display = tab === 'days' ? '' : 'none';
      tabNotes.style.display = tab === 'notes' ? '' : 'none';
      renderActiveTab();
    }

    filterTabs.addEventListener('click', (e) => {
      const tab = e.target.closest('.filter-tab');
      if (!tab) return;
      switchTab(tab.dataset.tab);
    });

    async function renderActiveTab() {
      if (activeTab === 'work') await renderWorkTree();
      else if (activeTab === 'days') {
        await loadCalendarData();
        renderCalendar();
      }
      else if (activeTab === 'notes') renderNotesList();
      updateBadges();
    }

    // ── Badge counts ──

    function updateBadges() {
      const q = searchQuery.toLowerCase();

      // Hide badges entirely when there's no search query
      if (!q) {
        badgeWork.classList.add('hidden');
        badgeDays.classList.add('hidden');
        badgeNotes.classList.add('hidden');
        return;
      }

      badgeWork.classList.remove('hidden');
      badgeDays.classList.remove('hidden');
      badgeNotes.classList.remove('hidden');

      // Work count: matching tasks + projects
      let workCount = 0;
      const { projects, tasks } = allTasksData;
      const matchingProjects = new Set();
      for (const t of tasks) {
        if (t.title.toLowerCase().includes(q)) {
          workCount++;
          if (t.project) matchingProjects.add(t.project);
        }
      }
      for (const p of projects) {
        if (p.name.toLowerCase().includes(q)) matchingProjects.add(p.id);
      }
      workCount += matchingProjects.size;
      badgeWork.textContent = workCount;

      // Days count: matched daily pages
      badgeDays.textContent = searchMatchedDailyIds.size;

      // Notes count
      const notesCount = allPages.filter(p => p.pageType === 'note' && p.title.toLowerCase().includes(q)).length;
      badgeNotes.textContent = notesCount;
    }

    // ══════════════════════════════════════
    // ── WORK TAB: Tree View ──
    // ══════════════════════════════════════

    function renderArchivedSection(archivedTasks, sectionKey) {
      const isOpen = expandedArchived.has(sectionKey);
      const container = document.createElement('div');
      container.className = 'tree-archived-section';

      const header = document.createElement('div');
      header.className = 'tree-archived-header';

      const chevron = document.createElement('span');
      chevron.className = 'tree-chevron' + (isOpen ? ' expanded' : '');
      chevron.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

      const label = document.createElement('span');
      label.className = 'tree-archived-label';
      label.textContent = `Archived (${archivedTasks.length})`;

      header.appendChild(chevron);
      header.appendChild(label);
      header.addEventListener('click', () => {
        if (expandedArchived.has(sectionKey)) expandedArchived.delete(sectionKey);
        else expandedArchived.add(sectionKey);
        renderWorkTree();
      });

      container.appendChild(header);

      if (isOpen) {
        const sorted = [...archivedTasks].sort((a, b) => a.order - b.order);
        for (const task of sorted) {
          container.appendChild(createTaskRow(task));
        }
      }

      return container;
    }

    async function renderWorkTree() {
      const { projects, tasks } = allTasksData;
      const q = searchQuery.toLowerCase();

      // Group tasks by project
      const projectMap = new Map();
      for (const p of projects) {
        projectMap.set(p.id, { ...p, tasks: [] });
      }
      const unassigned = [];

      for (const t of tasks) {
        if (q && !t.title.toLowerCase().includes(q)) {
          // Check if project name matches — if so, include all tasks
          if (t.project) {
            const proj = projectMap.get(t.project);
            if (proj && !proj.name.toLowerCase().includes(q)) continue;
          } else {
            continue;
          }
        }
        if (t.project && projectMap.has(t.project)) {
          projectMap.get(t.project).tasks.push(t);
        } else {
          unassigned.push(t);
        }
      }

      // Sort projects by order
      const sortedProjects = [...projectMap.values()]
        .filter(p => {
          if (q) {
            return p.tasks.length > 0 || p.name.toLowerCase().includes(q);
          }
          return true;
        })
        .sort((a, b) => a.order - b.order);

      workTree.innerHTML = '';

      if (sortedProjects.length === 0 && unassigned.length === 0) {
        workEmpty.style.display = '';
        return;
      }
      workEmpty.style.display = 'none';

      for (const proj of sortedProjects) {
        const totalSecs = proj.tasks.reduce((sum, t) => sum + t.totalSeconds, 0);
        const isExpanded = expandedProjects.has(proj.id);

        const activeTasks = proj.tasks.filter(t => !t.archived);
        const archivedTasks = proj.tasks.filter(t => t.archived);

        // Project header
        const header = document.createElement('div');
        header.className = 'tree-project-header';

        const chevron = document.createElement('span');
        chevron.className = 'tree-chevron' + (isExpanded ? ' expanded' : '');
        chevron.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
        chevron.addEventListener('click', (e) => {
          e.stopPropagation();
          if (expandedProjects.has(proj.id)) expandedProjects.delete(proj.id);
          else expandedProjects.add(proj.id);
          renderWorkTree();
        });

        const dot = document.createElement('span');
        dot.className = 'tree-project-dot';
        dot.style.background = proj.color;

        const nameWrap = document.createElement('span');
        nameWrap.className = 'tree-name-wrap';

        const name = document.createElement('span');
        name.className = 'tree-project-name';
        name.textContent = proj.name;

        const nameArrow = document.createElement('span');
        nameArrow.className = 'tree-open-arrow';
        nameArrow.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5h6M5.5 2.5L8 5l-2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

        nameWrap.appendChild(name);
        nameWrap.appendChild(nameArrow);
        nameWrap.addEventListener('click', (e) => {
          e.stopPropagation();
          openPage({ id: 'project_' + proj.id, title: proj.name, pageType: 'project' });
        });

        const time = document.createElement('span');
        time.className = 'tree-time';
        time.textContent = formatDuration(totalSecs);
        if (totalSecs > 0) {
          time.classList.add('clickable');
          time.addEventListener('click', (e) => {
            e.stopPropagation();
            openPage({ id: 'project_' + proj.id, title: proj.name, pageType: 'project' }, { view: 'timeline' });
          });
        }

        header.appendChild(chevron);
        header.appendChild(dot);
        header.appendChild(nameWrap);
        header.appendChild(time);
        workTree.appendChild(header);

        // Task rows (if expanded)
        if (isExpanded) {
          // Active tasks first
          const sortedActive = [...activeTasks].sort((a, b) => a.order - b.order);
          for (const task of sortedActive) {
            workTree.appendChild(createTaskRow(task));
          }
          // Archived section (collapsed by default)
          if (archivedTasks.length > 0) {
            workTree.appendChild(renderArchivedSection(archivedTasks, 'proj_' + proj.id));
          }
        }
      }

      // Unassigned tasks divider + rows
      const unassignedActive = unassigned.filter(t => !t.archived);
      const unassignedArchived = unassigned.filter(t => t.archived);

      if (unassignedActive.length > 0 || unassignedArchived.length > 0) {
        if (sortedProjects.length > 0) {
          const divider = document.createElement('div');
          divider.className = 'tree-divider';
          workTree.appendChild(divider);
        }
        const sortedActive = [...unassignedActive].sort((a, b) => a.order - b.order);
        for (const task of sortedActive) {
          workTree.appendChild(createTaskRow(task));
        }
        if (unassignedArchived.length > 0) {
          workTree.appendChild(renderArchivedSection(unassignedArchived, '_unassigned'));
        }
      }
    }

    function createTaskRow(task) {
      const row = document.createElement('div');
      row.className = 'tree-task-row' + (task.completed ? ' completed' : '') + (task.inProgress ? ' in-progress' : '');

      const status = document.createElement('span');
      status.className = 'tree-task-status';
      if (task.completed) {
        status.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="#6366f1" stroke-width="1.2" fill="none"/><path d="M4.5 7l2 2 3.5-3.5" stroke="#6366f1" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      } else if (task.inProgress) {
        status.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="#6366f1" stroke-width="1.2" fill="none"/><circle cx="7" cy="7" r="3" fill="#6366f1"/></svg>';
        status.classList.add('pulse');
      } else {
        status.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="#cbd5e1" stroke-width="1.2" fill="none"/></svg>';
      }

      const titleWrap = document.createElement('span');
      titleWrap.className = 'tree-name-wrap';

      const title = document.createElement('span');
      title.className = 'tree-task-title';
      title.textContent = task.title;

      const titleArrow = document.createElement('span');
      titleArrow.className = 'tree-open-arrow';
      titleArrow.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5h6M5.5 2.5L8 5l-2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

      titleWrap.appendChild(title);
      titleWrap.appendChild(titleArrow);
      titleWrap.addEventListener('click', (e) => {
        e.stopPropagation();
        openPage({ id: task.id, title: task.title, pageType: 'task' });
      });

      const time = document.createElement('span');
      time.className = 'tree-time';
      time.textContent = formatDuration(task.totalSeconds);
      if (task.totalSeconds > 0) {
        time.classList.add('clickable');
        time.addEventListener('click', (e) => {
          e.stopPropagation();
          openPage({ id: task.id, title: task.title, pageType: 'task' }, { view: 'timeline' });
        });
      }

      row.appendChild(status);
      row.appendChild(titleWrap);
      row.appendChild(time);
      return row;
    }

    // ══════════════════════════════════════
    // ── DAYS TAB: Calendar View ──
    // ══════════════════════════════════════

    function renderCalendar() {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      // First day of month and total days
      const firstDay = new Date(calendarYear, calendarMonth - 1, 1);
      const daysInMonth = new Date(calendarYear, calendarMonth, 0).getDate();
      // Monday = 0, Sunday = 6
      let startDow = firstDay.getDay() - 1;
      if (startDow < 0) startDow = 6;

      let html = '';

      // Navigation header
      html += '<div class="cal-nav">';
      html += '<button class="cal-nav-btn" id="cal-prev"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 2L4 6l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>';
      html += `<span class="cal-month-label">${monthNames[calendarMonth - 1]} ${calendarYear}</span>`;
      html += '<button class="cal-nav-btn" id="cal-next"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>';
      html += '</div>';

      // Day headers
      html += '<div class="cal-grid">';
      const dayLabels = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
      for (const d of dayLabels) {
        html += `<div class="cal-header-cell">${d}</div>`;
      }

      // Empty cells before first day
      for (let i = 0; i < startDow; i++) {
        html += '<div class="cal-cell empty"></div>';
      }

      // Day cells
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calendarYear}-${String(calendarMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const secs = monthTimeData[dateStr] || 0;
        const isToday = dateStr === todayStr;
        const hasData = secs > 0;
        const isSearchMatch = searchQuery && searchMatchedDailyIds.has('daily_' + dateStr);

        let cls = 'cal-cell';
        if (isToday) cls += ' today';
        if (hasData) cls += ' has-data';
        if (isSearchMatch) cls += ' search-match';

        html += `<div class="${cls}" data-date="${dateStr}">`;
        html += `<span class="cal-day-num">${day}</span>`;
        if (hasData) {
          html += `<span class="cal-day-time" data-date="${dateStr}">${formatDuration(secs)}</span>`;
        }
        html += '</div>';
      }

      html += '</div>';
      calendarView.innerHTML = html;

      // Wire navigation
      document.getElementById('cal-prev').addEventListener('click', () => {
        calendarMonth--;
        if (calendarMonth < 1) { calendarMonth = 12; calendarYear--; }
        loadCalendarData().then(() => { renderCalendar(); updateBadges(); });
      });
      document.getElementById('cal-next').addEventListener('click', () => {
        calendarMonth++;
        if (calendarMonth > 12) { calendarMonth = 1; calendarYear++; }
        loadCalendarData().then(() => { renderCalendar(); updateBadges(); });
      });

      // Wire cell clicks
      calendarView.querySelectorAll('.cal-cell.has-data').forEach(cell => {
        const dateStr = cell.dataset.date;
        const dayNum = cell.querySelector('.cal-day-num');
        const dayTime = cell.querySelector('.cal-day-time');

        // Click on date number → notes editor
        dayNum.addEventListener('click', (e) => {
          e.stopPropagation();
          const d = new Date(dateStr + 'T00:00:00');
          const title = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
          openPage({ id: 'daily_' + dateStr, title, pageType: 'daily' });
        });

        // Click on time → timeline
        if (dayTime) {
          dayTime.addEventListener('click', (e) => {
            e.stopPropagation();
            const d = new Date(dateStr + 'T00:00:00');
            const title = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            openPage({ id: 'daily_' + dateStr, title, pageType: 'daily' }, { view: 'timeline' });
          });
        }

        // Click on cell itself (anywhere) → notes editor
        cell.addEventListener('click', () => {
          const d = new Date(dateStr + 'T00:00:00');
          const title = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
          openPage({ id: 'daily_' + dateStr, title, pageType: 'daily' });
        });
      });
    }

    // ══════════════════════════════════════
    // ── NOTES TAB ──
    // ══════════════════════════════════════

    function renderNotesList() {
      const q = searchQuery.toLowerCase();
      let notes = allPages.filter(p => p.pageType === 'note');
      if (q) {
        notes = notes.filter(p => p.title.toLowerCase().includes(q));
      }

      notesList.innerHTML = '';

      if (notes.length === 0) {
        notesEmpty.style.display = '';
        notesEmpty.querySelector('p').textContent = q
          ? `No notes matching "${searchQuery}"`
          : 'No notes yet. Create one to get started.';
        return;
      }
      notesEmpty.style.display = 'none';

      const noteIconSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4.5 1.5h5l3.5 3.5v8.5a1.5 1.5 0 01-1.5 1.5h-7A1.5 1.5 0 013 13.5V3a1.5 1.5 0 011.5-1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/><path d="M9.5 1.5V5.5h4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
      const deleteSvg = '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

      for (const page of notes) {
        const row = document.createElement('div');
        row.className = 'page-row';

        const icon = document.createElement('div');
        icon.className = 'page-row-icon type-note';
        icon.innerHTML = noteIconSvg;

        const content = document.createElement('div');
        content.className = 'page-row-content';

        const title = document.createElement('div');
        title.className = 'page-row-title';
        title.textContent = page.title;

        const date = document.createElement('span');
        date.className = 'page-row-date';
        date.textContent = formatRelativeDate(page.updatedAt);

        content.appendChild(title);
        content.appendChild(date);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'page-row-delete';
        deleteBtn.innerHTML = deleteSvg;
        deleteBtn.title = 'Delete note';
        deleteBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await invoke('delete_page', { taskId: page.id });
          await loadPages();
          renderNotesList();
          updateBadges();
        });

        row.appendChild(icon);
        row.appendChild(content);
        row.appendChild(deleteBtn);
        row.addEventListener('click', () => openPage(page));
        notesList.appendChild(row);
      }
    }

    // ── Search handler ──

    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.trim();
      renderActiveTab();

      // Debounced content search for calendar highlights
      clearTimeout(searchTimer);
      if (searchQuery.length >= 2) {
        searchTimer = setTimeout(async () => {
          try {
            const results = await invoke('search_pages', { query: searchQuery });
            searchMatchedDailyIds = new Set(
              results.filter(r => r.pageType === 'daily').map(r => r.id)
            );
            if (activeTab === 'days') renderCalendar();
            updateBadges();
          } catch (e) {
            console.error('Search failed:', e);
          }
        }, 300);
      } else {
        searchMatchedDailyIds = new Set();
        if (activeTab === 'days') renderCalendar();
        updateBadges();
      }
    });

    // ── New note ──

    newNoteBtn.addEventListener('click', async () => {
      try {
        const meta = await invoke('create_note_page');
        await loadPages();
        openPage(meta);
      } catch (e) {
        console.error('Failed to create note:', e);
      }
    });

    // ── Open page (editor) ──

    async function openPage(pageMeta, openPageOptions) {
      currentPageId = pageMeta.id;
      currentPageMeta = pageMeta;

      // Load content
      let content = '';
      try {
        content = await invoke('load_page', { taskId: pageMeta.id });
      } catch (e) {
        console.error('Failed to load page:', e);
      }

      // Setup editor
      editor.commands.setContent(contentToHtml(content));

      // Title
      if (pageMeta.pageType === 'note') {
        editorTitleDisplay.style.display = 'none';
        editorTitleInput.style.display = '';
        editorTitleInput.value = pageMeta.title;
      } else {
        editorTitleDisplay.style.display = '';
        editorTitleInput.style.display = 'none';
        editorTitleDisplay.textContent = pageMeta.title;
      }

      // Type badge
      editorTypeBadge.textContent = getBadgeLabel(pageMeta.pageType);
      editorTypeBadge.className = `editor-type-badge page-type-badge type-${pageMeta.pageType}`;

      // Set initial view (notes or timeline)
      const initialView = openPageOptions?.view || 'notes';
      browserCurrentView = initialView;
      browserViewToggle.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      browserViewToggle.querySelector(`[data-view="${initialView}"]`).classList.add('active');
      if (initialView === 'timeline') {
        editorContainer.style.display = 'none';
        editorFormatBar.style.display = 'none';
        browserTimelineContainer.style.display = '';
        loadBrowserTimeline();
      } else {
        editorContainer.style.display = '';
        editorFormatBar.style.display = fmtBarOpen ? '' : 'none';
        browserTimelineContainer.style.display = 'none';
        stopBrowserTimelinePoll();
      }

      // Switch views
      listView.classList.add('hidden');
      editorView.classList.remove('hidden');
      if (initialView !== 'timeline') editor.commands.focus();
      editorStatus.textContent = '';
    }

    // ── Back button ──

    backBtn.addEventListener('click', async () => {
      await saveCurrentPage();
      currentPageId = null;
      currentPageMeta = null;

      editorView.classList.add('hidden');
      listView.classList.remove('hidden');

      // Refresh and render current tab
      await Promise.all([loadPages(), loadWorkData()]);
      renderActiveTab();
    });

    // ── Auto-save with debounce ──

    function scheduleSave() {
      clearTimeout(saveTimer);
      editorStatus.textContent = '';
      saveTimer = setTimeout(async () => {
        await saveCurrentPage();
        editorStatus.textContent = 'Saved';
        setTimeout(() => { editorStatus.textContent = ''; }, 1500);
      }, 400);
    }

    async function saveCurrentPage() {
      if (!currentPageId || !editor) return;
      try {
        await invoke('save_page', { taskId: currentPageId, content: editor.getHTML() });
      } catch (e) {
        console.error('Failed to save page:', e);
      }
    }

    // ── Title rename for notes ──

    editorTitleInput.addEventListener('blur', async () => {
      if (!currentPageMeta || currentPageMeta.pageType !== 'note') return;
      const newTitle = editorTitleInput.value.trim() || 'Untitled';
      if (newTitle !== currentPageMeta.title) {
        currentPageMeta.title = newTitle;
        try {
          await invoke('rename_page', { pageId: currentPageId, title: newTitle });
        } catch (e) {
          console.error('Failed to rename page:', e);
        }
      }
    });

    editorTitleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (editor) editor.commands.focus();
      }
    });

    // ── Save before close ──

    window.addEventListener('beforeunload', () => {
      clearTimeout(saveTimer);
      if (currentPageId && editor) {
        invoke('save_page', { taskId: currentPageId, content: editor.getHTML() });
      }
      stopBrowserTimelinePoll();
    });

    // ── Timeline in browser editor ──

    const browserViewToggle = document.getElementById('browser-view-toggle');
    const browserTimelineContainer = document.getElementById('browser-timeline-container');
    let browserCurrentView = 'notes';
    let browserTimelinePollInterval = null;

    function formatTimeShort(ms) {
      const d = new Date(ms);
      let h = d.getHours();
      const m = d.getMinutes();
      const ampm = h >= 12 ? 'p' : 'a';
      h = h % 12 || 12;
      return m === 0 ? `${h}${ampm}` : `${h}:${String(m).padStart(2, '0')}${ampm}`;
    }

    function formatTimelineDuration(ms) {
      const totalMin = Math.floor(ms / 60000);
      if (totalMin < 60) return `${totalMin}m`;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return m > 0 ? `${h}h ${m}m` : `${h}h`;
    }

    function formatDayLabel(ms) {
      const d = new Date(ms);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    browserViewToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.view-btn');
      if (!btn || btn.dataset.view === browserCurrentView) return;

      browserCurrentView = btn.dataset.view;
      browserViewToggle.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (browserCurrentView === 'timeline') {
        editorContainer.style.display = 'none';
        editorFormatBar.style.display = 'none';
        browserTimelineContainer.style.display = '';
        loadBrowserTimeline();
      } else {
        editorContainer.style.display = '';
        editorFormatBar.style.display = fmtBarOpen ? '' : 'none';
        browserTimelineContainer.style.display = 'none';
        stopBrowserTimelinePoll();
      }
    });

    function stopBrowserTimelinePoll() {
      if (browserTimelinePollInterval) {
        clearInterval(browserTimelinePollInterval);
        browserTimelinePollInterval = null;
      }
    }

    async function loadBrowserTimeline() {
      if (!currentPageId) return;
      try {
        const bouts = await invoke('load_timeline', { taskId: currentPageId });
        const isDaily = currentPageId.startsWith('daily_');
        if (isDaily) {
          renderBrowserDailyTimeline(bouts);
        } else {
          renderBrowserTaskTimeline(bouts);
        }
        stopBrowserTimelinePoll();
        if (bouts.some(b => b.endMs === null)) {
          browserTimelinePollInterval = setInterval(loadBrowserTimeline, 10000);
        }
      } catch (e) {
        console.error('Failed to load timeline:', e);
        browserTimelineContainer.innerHTML = '<div class="timeline-empty">Failed to load timeline</div>';
      }
    }

    function renderBrowserTaskTimeline(bouts) {
      if (!bouts.length) {
        browserTimelineContainer.innerHTML = '<div class="timeline-empty"><p>No sessions recorded</p></div>';
        return;
      }

      const dayGroups = new Map();
      for (const bout of bouts) {
        const dayKey = new Date(bout.startMs).toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
        if (!dayGroups.has(dayKey)) dayGroups.set(dayKey, []);
        dayGroups.get(dayKey).push(bout);
      }

      let totalMs = 0;
      let html = '<div class="timeline-task-view">';

      const PX_PER_HOUR = 80;
      const colors = ['#6366f1', '#8b5cf6', '#a78bfa', '#6d28d9', '#4f46e5'];
      const hasMultipleTasks = bouts.some(b => b.taskId !== bouts[0].taskId);

      for (const [dayKey, dayBouts] of dayGroups) {
        const dayLabel = formatDayLabel(dayBouts[0].startMs);
        const starts = dayBouts.map(b => b.startMs);
        const ends = dayBouts.map(b => b.endMs || Date.now());
        const minMs = Math.min(...starts);
        const maxMs = Math.max(...ends);

        const minDate = new Date(minMs);
        minDate.setMinutes(0, 0, 0);
        const axisStart = minDate.getTime();

        const maxDate = new Date(maxMs);
        maxDate.setMinutes(0, 0, 0);
        maxDate.setHours(maxDate.getHours() + 1);
        const axisEnd = maxDate.getTime();
        const axisSpan = axisEnd - axisStart;
        const totalHours = axisSpan / 3600000;
        const axisWidthRaw = totalHours * PX_PER_HOUR;

        let ticksHtml = '';
        let gridHtml = '';
        const tickDate = new Date(axisStart);
        while (tickDate.getTime() <= axisEnd) {
          const leftPx = ((tickDate.getTime() - axisStart) / axisSpan) * axisWidthRaw;
          const label = formatTimeShort(tickDate.getTime());
          ticksHtml += `<div class="timeline-hour-tick" style="left:${leftPx}px"><span>${label}</span></div>`;
          gridHtml += `<div class="timeline-gridline" style="left:${leftPx}px"></div>`;
          const halfMs = tickDate.getTime() + 1800000;
          if (halfMs < axisEnd) {
            const halfPx = ((halfMs - axisStart) / axisSpan) * axisWidthRaw;
            gridHtml += `<div class="timeline-gridline minor" style="left:${halfPx}px"></div>`;
          }
          tickDate.setHours(tickDate.getHours() + 1);
        }

        let blocksHtml = '';
        for (const bout of dayBouts) {
          const endMs = bout.endMs || Date.now();
          const durationMs = endMs - bout.startMs;
          totalMs += durationMs;

          const leftPx = ((bout.startMs - axisStart) / axisSpan) * axisWidthRaw;
          const widthPx = Math.max((durationMs / axisSpan) * axisWidthRaw, 6);
          const activeClass = bout.endMs === null ? ' active' : '';
          const color = colors[bout.colorIndex % colors.length];
          const colorStyle = hasMultipleTasks ? `;background:${color}` : '';
          const timeRange = `${formatTimeShort(bout.startMs)}–${bout.endMs === null ? 'now' : formatTimeShort(bout.endMs)}`;
          const titleHtml = hasMultipleTasks ? `<span class="hblock-tooltip-title">${bout.taskTitle}</span>` : '';

          blocksHtml += `<div class="timeline-hblock${activeClass}" style="left:${leftPx}px;width:${widthPx}px${colorStyle}"><span class="hblock-tooltip">${titleHtml}<span class="hblock-tooltip-time">${timeRange}</span><span class="hblock-tooltip-dur">${formatTimelineDuration(durationMs)}</span></span></div>`;
        }

        html += `
          <div class="timeline-day-group">
            <div class="timeline-day-label">${dayLabel}</div>
            <div class="timeline-day-track">
              <div class="timeline-day-ticks" style="min-width:100%;width:${axisWidthRaw}px">${ticksHtml}</div>
              <div class="timeline-day-axis" style="min-width:100%;width:${axisWidthRaw}px">${gridHtml}${blocksHtml}</div>
            </div>
          </div>`;
      }

      html += `<div class="timeline-summary"><span>Total</span><span class="timeline-total-value">${formatTimelineDuration(totalMs)}</span></div>`;
      html += '</div>';
      browserTimelineContainer.innerHTML = html;

      browserTimelineContainer.querySelectorAll('.timeline-hblock').forEach(block => {
        const tooltip = block.querySelector('.hblock-tooltip');
        if (!tooltip) return;

        block.addEventListener('mouseenter', () => {
          const blockRect = block.getBoundingClientRect();
          const tooltipWidth = tooltip.offsetWidth || 120;
          const spaceRight = window.innerWidth - blockRect.right;

          tooltip.classList.remove('tooltip-left', 'tooltip-right');

          if (spaceRight >= tooltipWidth + 12) {
            tooltip.classList.add('tooltip-right');
            tooltip.style.left = (blockRect.right + 8) + 'px';
          } else {
            tooltip.classList.add('tooltip-left');
            tooltip.style.left = (blockRect.left - tooltipWidth - 8) + 'px';
          }
          tooltip.style.top = (blockRect.top + blockRect.height / 2 - tooltip.offsetHeight / 2) + 'px';
        });
      });
    }

    function renderBrowserDailyTimeline(bouts) {
      if (!bouts.length) {
        browserTimelineContainer.innerHTML = '<div class="timeline-empty"><p>No sessions recorded</p></div>';
        return;
      }

      const HOUR_HEIGHT = 60;
      const colors = ['#6366f1', '#8b5cf6', '#a78bfa', '#6d28d9', '#4f46e5'];

      const starts = bouts.map(b => b.startMs);
      const ends = bouts.map(b => b.endMs || Date.now());
      const minMs = Math.min(...starts);
      const maxMs = Math.max(...ends);

      const startDate = new Date(minMs);
      startDate.setMinutes(0, 0, 0);
      const axisStartMs = startDate.getTime();
      const startHour = startDate.getHours();

      const endDate = new Date(maxMs);
      endDate.setMinutes(0, 0, 0);
      endDate.setHours(endDate.getHours() + 1);
      const axisEndMs = endDate.getTime();

      const totalHours = Math.ceil((axisEndMs - axisStartMs) / 3600000);
      const axisHeight = totalHours * HOUR_HEIGHT;
      const axisSpan = axisEndMs - axisStartMs;

      let hoursHtml = '';
      for (let i = 0; i <= totalHours; i++) {
        const h = (startHour + i) % 24;
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        const top = i * HOUR_HEIGHT;
        hoursHtml += `<div class="timeline-hour-line" style="top:${top}px"><span>${h12} ${ampm}</span></div>`;
      }

      const nowTs = Date.now();
      let nowHtml = '';
      if (nowTs >= axisStartMs && nowTs <= axisEndMs) {
        const nowTop = ((nowTs - axisStartMs) / axisSpan) * axisHeight;
        nowHtml = `<div class="timeline-now-marker" style="top:${nowTop}px"><span>now</span></div>`;
      }

      let totalMs = 0;
      let blocksHtml = '';
      for (const bout of bouts) {
        const endMs = bout.endMs || Date.now();
        const durationMs = endMs - bout.startMs;
        totalMs += durationMs;

        const top = ((bout.startMs - axisStartMs) / axisSpan) * axisHeight;
        const rawHeight = (durationMs / axisSpan) * axisHeight;
        const height = Math.max(rawHeight, 4);
        const color = colors[bout.colorIndex % colors.length];
        const activeClass = bout.endMs === null ? ' active' : '';
        const label = `${bout.taskTitle} · ${formatTimelineDuration(durationMs)}`;
        const timeLabel = `${formatTimeShort(bout.startMs)}–${bout.endMs === null ? 'now' : formatTimeShort(bout.endMs)}`;
        const isShort = height < 28;

        if (isShort) {
          blocksHtml += `<div class="timeline-vblock short${activeClass}" style="top:${top}px;height:${height}px;background:${color}" title="${timeLabel} · ${formatTimelineDuration(durationMs)}"></div><div class="vblock-side-label" style="top:${top}px;color:${color}">${label} <span class="vblock-side-time">${timeLabel}</span></div>`;
        } else {
          blocksHtml += `<div class="timeline-vblock${activeClass}" style="top:${top}px;height:${height}px;background:${color}" title="${timeLabel} · ${formatTimelineDuration(durationMs)}"><span class="vblock-label">${label}</span><span class="vblock-time">${timeLabel}</span></div>`;
        }
      }

      let html = `
        <div class="timeline-daily-view">
          <div class="timeline-vaxis" style="height:${axisHeight}px">
            ${hoursHtml}
            ${blocksHtml}
            ${nowHtml}
          </div>
          <div class="timeline-summary"><span>Total</span><span class="timeline-total-value">${formatTimelineDuration(totalMs)}</span></div>
        </div>`;

      browserTimelineContainer.innerHTML = html;
    }

    // ── Navigate-to-page event (from open_page_window command) ──

    async function resolvePageMeta(taskId) {
      if (taskId.startsWith('daily_')) {
        const dateStr = taskId.substring(6);
        const d = new Date(dateStr + 'T00:00:00');
        const title = d.toLocaleDateString('en-US', {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
        });
        return { id: taskId, title, pageType: 'daily' };
      }
      if (taskId.startsWith('project_')) {
        const projectId = taskId.substring(8);
        try {
          const projects = await invoke('get_projects');
          const proj = projects.find(p => p.id === projectId);
          if (proj) return { id: taskId, title: proj.name, pageType: 'project' };
        } catch (e) { /* fallback below */ }
        return { id: taskId, title: projectId, pageType: 'project' };
      }
      const found = allPages.find(p => p.id === taskId);
      if (found) return found;
      try {
        const data = await invoke('load_data');
        const allTasks = [...(data.todos || []), ...(data.archivedTodos || [])];
        const task = allTasks.find(t => t.id === taskId);
        if (task) return { id: taskId, title: task.title, pageType: 'task' };
      } catch (e) {
        console.error('Failed to resolve page meta:', e);
      }
      return { id: taskId, title: 'Notes', pageType: 'task' };
    }

    listen('navigate-to-page', async (event) => {
      const payload = event.payload;
      const taskId = typeof payload === 'string' ? payload : payload.taskId;
      const view = typeof payload === 'string' ? null : payload.view;
      const pageMeta = await resolvePageMeta(taskId);
      openPage(pageMeta, view ? { view } : null);
    });

    // ── Init ──

    const urlParams = new URLSearchParams(window.location.search);
    const initialPageId = urlParams.get('page');
    const initialView = urlParams.get('view');

    // Load all data in parallel
    await Promise.all([loadPages(), loadWorkData(), loadCalendarData()]);

    if (initialPageId) {
      listView.classList.add('hidden');
      editorView.classList.remove('hidden');
      const pageMeta = await resolvePageMeta(initialPageId);
      await openPage(pageMeta, initialView ? { view: initialView } : null);
      reveal();
    } else {
      renderActiveTab();
      reveal();
    }
  })();
  </script>
</body>
</html>
